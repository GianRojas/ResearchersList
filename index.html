<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ficha académica de investigadores">
  <title>Ficha de investigador</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="module" src="./js/app.js"></script>
</head>

<body>
  <main class="contenedor">
    <p class="identificador">Directorio de investigadores</p>
    <p id="estado" class="estado" role="status">Cargando ficha…</p>
    <article id="ficha" hidden>
      <header class="cabecera">
        <p class="sobretitulo">Ficha académica</p>
        <h1 id="nombre"></h1>
        <a id="correo" class="correo"></a>
      </header>
      <div id="contenido"></div>
    </article>
  </main>
  <footer class="pie">
    <div class="logos">
      <img src="/img/conocimientos.jpeg" alt="Logo 1">
      <img src="/img/MinCienciaTech.jpeg" alt="Logo 2">
      <img src="/img/UTALCA.jpeg" alt="Logo 3">
      <img src="/img/UHO.jpeg" alt="Logo 3">
    </div>
  </footer>
</body>

</html>
